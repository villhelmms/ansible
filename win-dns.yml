---
- hosts: windows
  tasks:
    - name: Set DNS servers to 1.1.1.1 and 1.0.0.1
      win_shell: |
        $adapter = Get-NetAdapter | Where-Object { $_.Status -eq "Up" }
        if ($adapter) {
          Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses ("1.1.1.1","1.0.0.1")
        }
      register: dns_set
      changed_when: dns_set.rc == 0

    - name: Check current DNS configuration
      win_shell: |
        $result = Get-DnsClientServerAddress | Select-Object -ExpandProperty ServerAddresses
        if ($result) { $result -join ", " } else { "No DNS servers configured" }
      register: dns_check

    - name: Verify DNS servers are set correctly
      debug:
        msg: "DNS servers are configured as: {{ dns_check.stdout }}"
      when: dns_check.stdout is defined

    - name: Validate Cloudflare DNS servers
      assert:
        that:
          - "'1.1.1.1' in dns_check.stdout"
          - "'1.0.0.1' in dns_check.stdout"
        fail_msg: "DNS servers are not correctly set to 1.1.1.1 and 1.0.0.1"
        success_msg: "DNS servers successfully set to Cloudflare DNS (1.1.1.1, 1.0.0.1)"
